# ------- General -------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on                    # Enable mouse (scroll, click panes, resize)
set -g history-limit 50000         # Big scrollback for long Claude Code output
set -g base-index 1                # Start window numbering at 1
setw -g pane-base-index 1          # Start pane numbering at 1
set -s escape-time 0               # No delay on Escape key (important for vim users)
set -g status-interval 5

# ------- Prefix Key -------
# Default is Ctrl-b. Many people remap to Ctrl-a (easier to reach):
# Uncomment the next two lines if you want Ctrl-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ------- Pane Splitting (more intuitive keys) -------
bind | split-window -h -c "#{pane_current_path}"   # Prefix + | for vertical split
bind - split-window -v -c "#{pane_current_path}"   # Prefix + - for horizontal split

# ------- Pane Navigation (Alt + arrow, no prefix needed) -------
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ------- Pane Resizing (Prefix + arrow) -------
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# ------- Quick Reload -------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ------- Status Bar (clean and minimal) -------
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right "#[fg=#a6adc8] %H:%M "
set -g status-left-length 30
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "

# ------- Pane Borders -------
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
